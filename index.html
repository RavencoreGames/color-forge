<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ravencore Color Forge</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           THEME CONTROL
           ========================================= */

        #themeControl {
            position: absolute;

            left: 1050px;
            top: 785px;

            width: 300px;

            z-index: 20;
        }

        #themeButton {
            width: 100%;
            height: 70px;

            padding: 8px 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-sizing: border-box;

            border: 3px solid #6b4a2d;
            border-radius: 8px;

            background: linear-gradient(
                to bottom,
                #5c4935,
                #38291d
            );

            color: #ead9b5;

            font-family: Georgia, serif;

            font-size: 18px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                inset 0 2px 3px rgba(255,255,255,0.15),
                inset 0 -5px 8px rgba(0,0,0,0.5),
                0 5px 8px rgba(0,0,0,0.6);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease,
                filter 0.15s ease;
        }

        #themeButton:hover {
            filter: brightness(1.25);
        }

        #themeButton:active {
            transform: translateY(4px);

            box-shadow:
                inset 0 4px 7px rgba(0,0,0,0.6),
                0 1px 2px rgba(0,0,0,0.7);
        }

        #themeButton.active {
            filter: brightness(1.5);

            box-shadow:
                0 0 12px rgba(255,190,80,0.7),
                inset 0 2px 4px rgba(255,255,255,0.2),
                inset 0 -4px 8px rgba(0,0,0,0.5);
        }

        #themeMenu {
            position: absolute;

            left: 0;

            bottom: calc(100% + 10px);

            width: 100%;

            display: none;

            padding: 8px;

            box-sizing: border-box;

            background: linear-gradient(
                to bottom,
                #49382a,
                #241a12
            );

            border: 3px solid #765333;
            border-radius: 8px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.7),
                inset 0 1px 2px rgba(255,255,255,0.12);
        }

        #themeMenu.open {
            display: block;
        }

        #themeMenu button {
            width: 100%;

            padding: 11px 12px;

            margin: 3px 0;

            border: 1px solid #765333;

            background: #302218;

            color: #ead9b5;

            font-family: Georgia, serif;

            font-size: 16px;

            text-align: left;

            cursor: pointer;
        }

        #themeMenu button:hover {
            background: #5a432d;
            color: #fff1c7;
        }
    </style>

</head>

<body>

    <div id="stage">

        <div id="forge">

            <!-- BACKGROUND -->
            <img
                id="background"
                src="background2.png"
                alt="Ravencore Color Forge"
            >

            <!-- THEME CONTROL -->
            <div id="themeControl">

                <button id="themeButton">
                    <span>THEME</span>
                    <span id="themeValue">MERMAID</span>
                    <span>▴</span>
                </button>

                <div id="themeMenu">

                    <button data-theme="mermaid">
                        MERMAID
                    </button>

                    <button data-theme="forest">
                        ENCHANTED FOREST
                    </button>

                    <button data-theme="dragon">
                        DRAGON
                    </button>

                    <button data-theme="arcane">
                        ARCANE
                    </button>

                    <button data-theme="fire">
                        FIRE &amp; EMBER
                    </button>

                    <button data-theme="celestial">
                        CELESTIAL
                    </button>

                    <button data-theme="moonlit">
                        MOONLIT
                    </button>

                    <button data-theme="random">
                        RANDOM
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           RESPONSIVE COLOR FORGE SCALING
           ========================================= */

        function scaleForge() {

            const forge =
                document.getElementById("forge");

            const baseWidth = 1536;
            const baseHeight = 1024;

            const scaleX =
                window.innerWidth / baseWidth;

            const scaleY =
                window.innerHeight / baseHeight;

            const scale =
                Math.min(scaleX, scaleY);

            forge.style.transform =
                `translate(-50%, -50%) scale(${scale})`;
        }


        window.addEventListener(
            "resize",
            scaleForge
        );

        scaleForge();


        /* =========================================
           THEME MENU
           ========================================= */

        const themeButton =
            document.getElementById("themeButton");

        const themeMenu =
            document.getElementById("themeMenu");

        const themeValue =
            document.getElementById("themeValue");


        themeButton.addEventListener(
            "click",
            function () {

                themeMenu.classList.toggle("open");

                themeButton.classList.toggle("active");

            }
        );


        const themeChoices =
            document.querySelectorAll(
                "#themeMenu button"
            );


        themeChoices.forEach(
            function (choice) {

                choice.addEventListener(
                    "click",
                    function (event) {

                        const selectedTheme =
                            event.currentTarget
                                .dataset.theme;

                        const selectedName =
                            event.currentTarget
                                .textContent
                                .trim();

                        themeValue.textContent =
                            selectedName;

                        themeMenu.classList.remove(
                            "open"
                        );

                        themeButton.classList.remove(
                            "active"
                        );

                        console.log(
                            "Theme selected:",
                            selectedTheme
                        );

                    }
                );

            }
        );

    </script>

</body>

</html>
