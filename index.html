        /* =========================================
           RESPONSIVE COLOR FORGE SCALING
           ========================================= */

        function scaleForge() {

            const forge =
                document.getElementById("forge");

            const baseWidth = 1536;
            const baseHeight = 1024;

            const scaleX =
                window.innerWidth / baseWidth;

            const scaleY =
                window.innerHeight / baseHeight;

            const scale =
                Math.min(scaleX, scaleY);

            forge.style.transform =
                `translate(-50%, -50%) scale(${scale})`;
        }


        window.addEventListener(
            "resize",
            scaleForge
        );

  /* =========================================
   HEX TO HSL
   ========================================= */

function hexToHSL(hex) {

    let r =
        parseInt(hex.substring(1, 3), 16) / 255;

    let g =
        parseInt(hex.substring(3, 5), 16) / 255;

    let b =
        parseInt(hex.substring(5, 7), 16) / 255;


    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    let h;
    let s;

    const l =
        (max + min) / 2;


    if (max === min) {

        h = 0;
        s = 0;

    } else {

        const d = max - min;

        s =
            l > 0.5
                ? d / (2 - max - min)
                : d / (max + min);


        switch (max) {

            case r:

                h =
                    (g - b) / d +
                    (g < b ? 6 : 0);

                break;

            case g:

                h =
                    (b - r) / d + 2;

                break;

            case b:

                h =
                    (r - g) / d + 4;

                break;

        }

        h /= 6;

    }


    return {
        h: h * 360,
        s: s * 100,
        l: l * 100
    };

}
/* =========================================
   HSL TO HEX
   ========================================= */

function hslToHex(h, s, l) {

    s /= 100;
    l /= 100;

    const c =
        (1 - Math.abs(2 * l - 1)) * s;

    const x =
        c * (1 - Math.abs((h / 60) % 2 - 1));

    const m =
        l - c / 2;

    let r = 0;
    let g = 0;
    let b = 0;


    if (h < 60) {

        r = c;
        g = x;

    } else if (h < 120) {

        r = x;
        g = c;

    } else if (h < 180) {

        g = c;
        b = x;

    } else if (h < 240) {

        g = x;
        b = c;

    } else if (h < 300) {

        r = x;
        b = c;

    } else {

        r = c;
        b = x;

    }


    r = Math.round((r + m) * 255);
    g = Math.round((g + m) * 255);
    b = Math.round((b + m) * 255);


    return "#" +
        r.toString(16).padStart(2, "0") +
        g.toString(16).padStart(2, "0") +
        b.toString(16).padStart(2, "0");
}

        /* =========================================
   HARMONY ADJUSTMENT
   ========================================= */

function applyHarmonyColor(hex, saturationChange, lightnessChange) {

    const hsl =
        hexToHSL(hex);

    hsl.s =
        Math.max(
            0,
            Math.min(
                100,
                hsl.s + saturationChange
            )
        );

    hsl.l =
        Math.max(
            0,
            Math.min(
                100,
                hsl.l + lightnessChange
            )
        );

    return hslToHex(
        hsl.h,
        hsl.s,
        hsl.l
    );
}
