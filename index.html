        /* =========================================
   RAVENCORE MAGICKAL SOUND SYSTEM
   ========================================= */

const magicSounds = [
    "Magickforge1.mp3",
    "Magickforge2.mp3",
    "Magickforge3.mp3"
];

let lastMagicSound = -1;
let currentMagicAudio = null;

function playMagicSound() {

    // Choose a sound different from the last one.
    let soundIndex;

    do {
        soundIndex = Math.floor(
            Math.random() * magicSounds.length
        );
    } while (soundIndex === lastMagicSound);

    lastMagicSound = soundIndex;

    // Stop any previous sound before starting another.
    if (currentMagicAudio) {
        currentMagicAudio.pause();
        currentMagicAudio.currentTime = 0;
    }

    currentMagicAudio = new Audio(
        magicSounds[soundIndex]
    );

    currentMagicAudio.volume = 0.5;

    currentMagicAudio.play().catch(error => {
        console.log("Sound playback unavailable:", error);
    });
}

function createMagicParticles() {

    const paintWells =
        document.querySelectorAll(".paintWell");

    paintWells.forEach((well, wellIndex) => {

        let effect =
            well.querySelector(".magicWellEffect");

        if (!effect) {
            effect = document.createElement("div");
            effect.className = "magicWellEffect";
            well.appendChild(effect);
        }

        let canvas = effect.querySelector("canvas");

        if (!canvas) {
            effect.innerHTML = "";
            canvas = document.createElement("canvas");
            canvas.className = "magicCanvas";
            effect.appendChild(canvas);
        }

        if (effect.animationFrame) {
            cancelAnimationFrame(effect.animationFrame);
        }

        const width = well.clientWidth;
        const height = well.clientHeight;

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        const direction =
            wellIndex % 2 === 0 ? 1 : -1;

        const duration =
    800 + wellIndex * 45;

const lingerDuration = 1000;
        
        const startTime = performance.now();

       const particles = Array.from(
    { length: 40 },
    () => ({
        angle: Math.random() * Math.PI * 2,
        turns: 0.8 + Math.random() * 0.8,
        radius: 0.35 + Math.random() * 0.65,
        size: 0.5 + Math.random() * 1.8,
        delay: Math.random() * 0.25
    })
);

        function draw(now) {

            const elapsed = now - startTime;

            const lingering = elapsed > duration;

            ctx.clearRect(0, 0, width, height);

            let stillRunning = false;

            particles.forEach(p => {

                const progress =
                    (elapsed / duration - p.delay) /
                    (1 - p.delay);

                if (progress < 0 || progress > 1) {
                    if (progress < 1) stillRunning = true;
                    return;
                }

                stillRunning = true;

                const angle =
                    p.angle +
                    direction *
                    progress *
                    p.turns *
                    Math.PI * 2;

                const maxRadiusX =
                    width * 0.43 * p.radius;

                const maxRadiusY =
                    height * 0.40 * p.radius;

                const radius =
                    5 + progress * maxRadiusX;

        const x =
    width / 2 +
    Math.cos(angle) * radius
    - (wellIndex === 4 ? 20 : 0)
    - (wellIndex === 3 ? 20 : 0);

const y =
    height / 2 +
    Math.sin(angle) *
    (5 + progress * maxRadiusY)
    - (wellIndex === 4 ? 16 : 0)
    - (wellIndex === 3 ? 16 : 0);

                const fade =
                    Math.min(1, progress * 8) *
                    Math.min(1, (1 - progress) * 5);

                // Draw a short curved trail behind each mote.
                ctx.beginPath();

                for (let step = 0; step <= 8; step++) {

                    const t =
                        Math.max(0, progress - step * 0.012);

                    const trailAngle =
                        p.angle +
                        direction *
                        t *
                        p.turns *
                        Math.PI * 2;

                    const trailRadius =
                        5 + t * maxRadiusX;

                    const trailX =
                        width / 2 +
                        Math.cos(trailAngle) * trailRadius;

                    const trailY =
                        height / 2 +
                        Math.sin(trailAngle) *
                        (5 + t * maxRadiusY);

                    if (step === 0) {
                        ctx.moveTo(trailX, trailY);
                    } else {
                        ctx.lineTo(trailX, trailY);
                    }
                }

                ctx.strokeStyle =
                    `rgba(255, 207, 91, ${fade * 0.8})`;

                ctx.lineWidth = p.size;
                ctx.shadowColor = "#ffd45c";
                ctx.shadowBlur = 8;
                ctx.stroke();

                // Draw the glowing dust mote.
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);

                ctx.fillStyle =
                    `rgba(255, 239, 180, ${fade})`;

                ctx.shadowColor = "#ffca48";
                ctx.shadowBlur = 10;
                ctx.fill();
            });

            ctx.shadowBlur = 0;

           if (stillRunning || elapsed < duration + lingerDuration) {

    if (lingering) {
        const lingerProgress =
            (elapsed - duration) / lingerDuration;

        const glow = Math.max(0, 1 - lingerProgress);

        for (let i = 0; i < 12; i++) {

            const angle =
                (i / 12) * Math.PI * 2 + wellIndex;

            const radiusX = width * 0.28;
            const radiusY = height * 0.25;

          const drift = lingerProgress * 18;

const x =
    width / 2 +
    Math.cos(angle) * (radiusX + drift);

const y =
    height / 2 +
    Math.sin(angle) * (radiusY + drift)
    - (wellIndex >= 3 ? 8 : 0)
    - lingerProgress * 6;
            
            ctx.beginPath();
            ctx.arc(x, y, 1.2, 0, Math.PI * 2);

            ctx.fillStyle =
                `rgba(255, 225, 145, ${glow * 0.65})`;

            ctx.shadowColor = "#ffd45c";
            ctx.shadowBlur = 8;
            ctx.fill();
        }

        ctx.shadowBlur = 0;
    }

    effect.animationFrame =
        requestAnimationFrame(draw);

} else {
    ctx.clearRect(0, 0, width, height);
}
        }

        effect.animationFrame =
            requestAnimationFrame(draw);
    });
}

        /* =========================================
           HEX TO HSL
           ========================================= */

        function hexToHSL(hex) {

            let r =
                parseInt(
                    hex.substring(1, 3),
                    16
                ) / 255;

            let g =
                parseInt(
                    hex.substring(3, 5),
                    16
                ) / 255;

            let b =
                parseInt(
                    hex.substring(5, 7),
                    16
                ) / 255;


            const max =
                Math.max(r, g, b);

            const min =
                Math.min(r, g, b);


            let h;
            let s;


            const l =
                (max + min) / 2;


            if (max === min) {

                h = 0;
                s = 0;

            } else {

                const d =
                    max - min;


                s =
                    l > 0.5
                        ? d / (2 - max - min)
                        : d / (max + min);


                switch (max) {

                    case r:

                        h =
                            (g - b) / d +
                            (g < b ? 6 : 0);

                        break;


                    case g:

                        h =
                            (b - r) / d + 2;

                        break;


                    case b:

                        h =
                            (r - g) / d + 4;

                        break;

                }


                h /= 6;

            }


            return {

                h: h * 360,
                s: s * 100,
                l: l * 100

            };

        }


        /* =========================================
           HSL TO HEX
           ========================================= */

        function hslToHex(h, s, l) {

            s /= 100;
            l /= 100;


            const c =
                (1 - Math.abs(2 * l - 1)) * s;


            const x =
                c *
                (1 - Math.abs(
                    (h / 60) % 2 - 1
                ));


            const m =
                l - c / 2;


            let r = 0;
            let g = 0;
            let b = 0;


            if (h < 60) {

                r = c;
                g = x;

            } else if (h < 120) {

                r = x;
                g = c;

            } else if (h < 180) {

                g = c;
                b = x;

            } else if (h < 240) {

                g = x;
                b = c;

            } else if (h < 300) {

                r = x;
                b = c;

            } else {

                r = c;
                b = x;

            }


            r =
                Math.round(
                    (r + m) * 255
                );

            g =
                Math.round(
                    (g + m) * 255
                );

            b =
                Math.round(
                    (b + m) * 255
                );


            return "#" +

                r.toString(16)
                    .padStart(2, "0") +

                g.toString(16)
                    .padStart(2, "0") +

                b.toString(16)
                    .padStart(2, "0");

        }


        /* =========================================
           HARMONY ADJUSTMENT
           ========================================= */

        function applyHarmonyColor(
            hex,
            saturationChange,
            lightnessChange
        ) {

            const hsl =
                hexToHSL(hex);


            hsl.s =
                Math.max(
                    0,
                    Math.min(
                        100,
                        hsl.s + saturationChange
                    )
                );


            hsl.l =
                Math.max(
                    0,
                    Math.min(
                        100,
                        hsl.l + lightnessChange
                    )
                );


            return hslToHex(
                hsl.h,
                hsl.s,
                hsl.l
            );

        }

                            color,
                            settings.saturation,
                            settings.lightness
                        );

                    }
                );


            return adjustedColors;

        }

/* =========================================
   DRAW ONE PAINT WELL
   ========================================= */

function drawPaintCircle(ctx, x, y, radius, color) {

    /* base paint */
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.closePath();

    ctx.fillStyle = color;
    ctx.fill();

    /* darker edge */
    const edgeGradient =
        ctx.createRadialGradient(
            x - radius * 0.15,
            y - radius * 0.15,
            radius * 0.2,
            x,
            y,
            radius
        );

    edgeGradient.addColorStop(0, "rgba(255,255,255,0.10)");
    edgeGradient.addColorStop(0.55, "rgba(255,255,255,0.02)");
    edgeGradient.addColorStop(1, "rgba(0,0,0,0.22)");

    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.closePath();

    ctx.fillStyle = edgeGradient;
    ctx.fill();

    /* glossy highlight */
    const glossGradient =
        ctx.createRadialGradient(
            x - radius * 0.35,
            y - radius * 0.35,
            radius * 0.05,
            x - radius * 0.35,
            y - radius * 0.35,
            radius * 0.55
        );

    glossGradient.addColorStop(0, "rgba(255,255,255,0.48)");
    glossGradient.addColorStop(0.35, "rgba(255,255,255,0.18)");
    glossGradient.addColorStop(1, "rgba(255,255,255,0)");

    ctx.beginPath();
    ctx.ellipse(
        x - radius * 0.12,
        y - radius * 0.16,
        radius * 0.62,
        radius * 0.42,
        -0.35,
        0,
        Math.PI * 2
    );
    ctx.closePath();

    ctx.fillStyle = glossGradient;
    ctx.fill();

    /* soft streak */
    ctx.beginPath();
    ctx.ellipse(
        x - radius * 0.10,
        y - radius * 0.02,
        radius * 0.42,
        radius * 0.12,
        -0.55,
        0,
        Math.PI * 2
    );
    ctx.closePath();

    ctx.fillStyle = "rgba(255,255,255,0.20)";
    ctx.fill();
}

/* =========================================
   EXPORT BUTTON CLICK SOUND
   ========================================= */

function playExportClick() {

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    const audioCtx = new AudioContextClass();

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    const now = audioCtx.currentTime;

    oscillator.type = "triangle";

    oscillator.frequency.setValueAtTime(950, now);
    oscillator.frequency.exponentialRampToValueAtTime(
        450, now + 0.07
    );

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(
        0.001, now + 0.08
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.08);

    oscillator.onended = function() {
        audioCtx.close();
    };
}


/* =========================================
   EXPORT BUTTON CLICK
   ========================================= */

exportPngButton.addEventListener("click", function() {

    playExportClick();

    exportPalettePNG();

});
