
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ravencore Color Forge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="stage">

        <div id="forge">

            <!-- PALETTE COLORS -->

            <div id="paletteColors">

                <div class="paintWell" id="well1"></div>
                <div class="paintWell" id="well2"></div>
                <div class="paintWell" id="well3"></div>
                <div class="paintWell" id="well4"></div>
                <div class="paintWell" id="well5"></div>

            </div>


            <div id="hexLabels">

                <span class="hexLabel" id="hex1">#4BAEB5</span>
                <span class="hexLabel" id="hex2">#65C9B0</span>
                <span class="hexLabel" id="hex3">#8FD5C8</span>
                <span class="hexLabel" id="hex4">#E8C35D</span>
                <span class="hexLabel" id="hex5">#D98245</span>

            </div>


            <!-- =========================================
                 BACKGROUND
                 ========================================= -->

            <img
                id="background"
                src="background2.png"
                alt="Ravencore Color Forge"
            >


            <!-- =========================================
                 THEME CONTROL
                 ========================================= -->

            <div id="themeControl">

                <button id="themeButton">
    <span id="themeValue">MERMAID</span>
</button>


                <div id="themeMenu">

                    <button data-theme="mermaid">
                        MERMAID
                    </button>

                    <button data-theme="forest">
                       FOREST
                    </button>

                    <button data-theme="dragon">
                        DRAGON
                    </button>

                    <button data-theme="arcane">
                        ARCANE
                    </button>

                    <button data-theme="faerie">
                        FAERIE
                    </button>

                    <button data-theme="moonlit">
                         MOONLIT
                    </button>

                    <button data-theme="undead">
                         UNDEAD
                    </button>

                    <button data-theme="random">
                        RANDOM
                    </button>

                </div>

            </div>


            <!-- =========================================
                 HARMONY CONTROL
                 ========================================= -->

            <div id="harmonyControl">

                <button id="harmonyButton">

                    <span>
                        HARMONY
                    </span>

                    <span id="harmonyValue">
                        WHISPER
                    </span>

                    <span>
                        ▴
                    </span>

                </button>


                <div id="harmonyMenu">

                    <button data-harmony="whisper">
                        WHISPER
                    </button>

                    <button data-harmony="awakened">
                        AWAKENED
                    </button>

                    <button data-harmony="kindled">
                        KINDLED
                    </button>

                    <button data-harmony="forged">
                        FORGED
                    </button>

                    <button data-harmony="radiant">
                        RADIANT
                    </button>

                    <button data-harmony="surge">
                        SURGE
                    </button>

                    <button data-harmony="random">
                        RANDOM
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

        /* =========================================
           RESPONSIVE COLOR FORGE SCALING
           ========================================= */

        function scaleForge() {

            const forge =
                document.getElementById("forge");

            const baseWidth = 1536;
            const baseHeight = 1024;

            const scaleX =
                window.innerWidth / baseWidth;

            const scaleY =
                window.innerHeight / baseHeight;

            const scale =
                Math.min(scaleX, scaleY);

            forge.style.transform =
                `translate(-50%, -50%) scale(${scale})`;
        }


        window.addEventListener(
            "resize",
            scaleForge
        );


        scaleForge();


        /* =========================================
           THEME MENU
           ========================================= */

       const themeButton =
    document.getElementById("themeButton");

const themeMenu =
    document.getElementById("themeMenu");

const themeValue =
    document.getElementById("themeValue");

        themeButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                themeMenu.classList.toggle("open");

            }
        );


        const themeChoices =
            document.querySelectorAll(
                "#themeMenu button"
            );


        themeChoices.forEach(
            function (choice) {

                choice.addEventListener(
                    "click",
                    function (event) {

                        event.stopPropagation();

                   const selectedTheme =
    event.currentTarget.dataset.theme;

const selectedName =
    event.currentTarget
        .textContent
        .trim();

themeValue.textContent =
    selectedName;

applyPalette(
    themePalettes[selectedTheme]
);

console.log(
    "Theme selected:",
    selectedTheme
);


                        /* CLOSE THE MENU */

                        themeMenu.classList.remove(
                            "open"
                        );

                    }
                );

            }
        );


        /* =========================================
           HARMONY MENU
           ========================================= */

        const harmonyButton =
            document.getElementById("harmonyButton");

        const harmonyMenu =
            document.getElementById("harmonyMenu");

        const harmonyValue =
            document.getElementById("harmonyValue");


        harmonyButton.addEventListener(
            "click",
            function () {

                harmonyMenu.classList.toggle("open");

                harmonyButton.classList.toggle("active");

            }
        );


        const harmonyChoices =
            document.querySelectorAll(
                "#harmonyMenu button"
            );


        harmonyChoices.forEach(
            function (choice) {

                choice.addEventListener(
                    "click",
                    function (event) {

                        const selectedHarmony =
                            event.currentTarget
                                .dataset.harmony;

                        const selectedName =
                            event.currentTarget
                                .textContent
                                .trim();


                        harmonyValue.textContent =
                            selectedName;


                        harmonyMenu.classList.remove(
                            "open"
                        );


                        harmonyButton.classList.remove(
                            "active"
                        );


                        console.log(
                            "Harmony selected:",
                            selectedHarmony
                        );

                    }
                );

            }
        );


       /* =========================================
   THEME PALETTES
   ========================================= */

const themePalettes = {

    mermaid: [
        "#176B87",
        "#219EBC",
        "#62C9C1",
        "#A8E6CF",
        "#D4B483"
    ],

    forest: [
        "#243B2A",
        "#426B45",
        "#789262",
        "#B5B86A",
        "#765238"
    ],

    dragon: [
        "#541F2A",
        "#963B3F",
        "#C96736",
        "#C6A04B",
        "#393247"
    ],

    arcane: [
        "#282044",
        "#543C8C",
        "#805DA8",
        "#B49BD4",
        "#4C9B91"
    ],

    faerie: [
        "#355A43",
        "#78A968",
        "#D6C85F",
        "#E58BB4",
        "#F6C6D9"
    ],

    moonlit: [
        "#101D46",
        "#244E87",
        "#466FB2",
        "#8B9ED0",
        "#D8B86A"
    ],

    undead: [
        "#343841",
        "#777D88",
        "#B5A58A",
        "#8B6BA5",
        "#C9B7D8"
    ]

};


 function applyPalette(colors) {

    document.getElementById("well1").style.backgroundColor =
        colors[0];

    document.getElementById("well2").style.backgroundColor =
        colors[1];

    document.getElementById("well3").style.backgroundColor =
        colors[2];

    document.getElementById("well4").style.backgroundColor =
        colors[3];

    document.getElementById("well5").style.backgroundColor =
        colors[4];


    hexLabels[0].textContent = colors[0];
    hexLabels[1].textContent = colors[1];
    hexLabels[2].textContent = colors[2];
    hexLabels[3].textContent = colors[3];
    hexLabels[4].textContent = colors[4];

}


const hexLabels = [
    document.getElementById("hex1"),
    document.getElementById("hex2"),
    document.getElementById("hex3"),
    document.getElementById("hex4"),
    document.getElementById("hex5")
];


applyPalette(themePalettes.mermaid);

        const paintWells =
            document.querySelectorAll(".paintWell");


        paintWells.forEach(function (well) {

            well.addEventListener("click", function () {

                const color =
                    getComputedStyle(well).backgroundColor;

                console.log(
                    "Selected color:",
                    color
                );

            });

        });

    </script>

</body>

</html>
