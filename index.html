<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ravencore Color Forge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="stage">

        <div id="forge">
            
<!-- PALETTE COLORS -->
<div id="paletteColors">

    <div class="paintWell" id="well1"></div>
    <div class="paintWell" id="well2"></div>
    <div class="paintWell" id="well3"></div>
    <div class="paintWell" id="well4"></div>
    <div class="paintWell" id="well5"></div>

</div>
            
            <!-- =========================================
                 BACKGROUND
                 ========================================= -->

            <img
                id="background"
                src="background2.png"
                alt="Ravencore Color Forge"
            >


            <!-- =========================================
                 THEME CONTROL
                 ========================================= -->

            <div id="themeControl">

              <button id="themeButton"></button>


                <div id="themeMenu">

                    <button data-theme="mermaid">
                        MERMAID
                    </button>

                    <button data-theme="forest">
                        ENCHANTED FOREST
                    </button>

                    <button data-theme="dragon">
                        DRAGON
                    </button>

                    <button data-theme="arcane">
                        ARCANE
                    </button>

                    <button data-theme="fire">
                        FIRE &amp; EMBER
                    </button>

                    <button data-theme="celestial">
                        CELESTIAL
                    </button>

                    <button data-theme="moonlit">
                        MOONLIT
                    </button>

                    <button data-theme="random">
                        RANDOM
                    </button>

                </div>

            </div>


            <!-- =========================================
                 HARMONY CONTROL
                 ========================================= -->

            <div id="harmonyControl">

                <button id="harmonyButton">

                    <span>
                        HARMONY
                    </span>

                    <span id="harmonyValue">
                        OCEANIC
                    </span>

                    <span>
                        ▴
                    </span>

                </button>


                <div id="harmonyMenu">

                    <button data-harmony="oceanic">
                        OCEANIC
                    </button>

                    <button data-harmony="forest">
                        FOREST
                    </button>

                    <button data-harmony="sunset">
                        SUNSET
                    </button>

                    <button data-harmony="autumn">
                        AUTUMN
                    </button>

                    <button data-harmony="mystical">
                        MYSTICAL
                    </button>

                    <button data-harmony="monochrome">
                        MONOCHROME
                    </button>

                    <button data-harmony="random">
                        RANDOM
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

        /* =========================================
           RESPONSIVE COLOR FORGE SCALING
           ========================================= */

        function scaleForge() {

            const forge =
                document.getElementById("forge");

            const baseWidth = 1536;
            const baseHeight = 1024;

            const scaleX =
                window.innerWidth / baseWidth;

            const scaleY =
                window.innerHeight / baseHeight;

            const scale =
                Math.min(scaleX, scaleY);

            forge.style.transform =
                `translate(-50%, -50%) scale(${scale})`;
        }


        window.addEventListener(
            "resize",
            scaleForge
        );


        scaleForge();



     /* =========================================
   THEME MENU
   ========================================= */

const themeButton =
    document.getElementById("themeButton");

const themeMenu =
    document.getElementById("themeMenu");


themeButton.addEventListener(
    "click",
    function (event) {

        event.stopPropagation();

        themeMenu.classList.toggle("open");

    }
);


const themeChoices =
    document.querySelectorAll(
        "#themeMenu button"
    );


themeChoices.forEach(
    function (choice) {

        choice.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                const selectedTheme =
                    event.currentTarget.dataset.theme;

                console.log(
                    "Theme selected:",
                    selectedTheme
                );


                /* CLOSE THE MENU */

                themeMenu.classList.remove(
                    "open"
                );

            }
        );

    }
);

        /* =========================================
           HARMONY MENU
           ========================================= */

        const harmonyButton =
            document.getElementById("harmonyButton");

        const harmonyMenu =
            document.getElementById("harmonyMenu");

        const harmonyValue =
            document.getElementById("harmonyValue");


        harmonyButton.addEventListener(
            "click",
            function () {

                harmonyMenu.classList.toggle("open");

                harmonyButton.classList.toggle("active");

            }
        );


        const harmonyChoices =
            document.querySelectorAll(
                "#harmonyMenu button"
            );


        harmonyChoices.forEach(
            function (choice) {

                choice.addEventListener(
                    "click",
                    function (event) {

                        const selectedHarmony =
                            event.currentTarget
                                .dataset.harmony;

                        const selectedName =
                            event.currentTarget
                                .textContent
                                .trim();


                        harmonyValue.textContent =
                            selectedName;


                        harmonyMenu.classList.remove(
                            "open"
                        );


                        harmonyButton.classList.remove(
                            "active"
                        );


                        console.log(
                            "Harmony selected:",
                            selectedHarmony
                        );

                    }
                );

            }
        );

    </script>
